<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strongest of the Tower</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1117;color:#e8e9ee;font:15px Segoe UI,system-ui,sans-serif}
header{padding:16px 22px 6px;max-width:1300px;margin:auto}nav{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}nav a{color:#8fb4ff;text-decoration:none}nav b{color:#e8e9ee}
h1{margin:10px 0 2px;font-size:28px}.sub{color:#9aa3b5;font-size:14px}
main{max-width:1300px;margin:auto;padding:10px 22px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.bar button{border:0;border-radius:7px;background:#20242f;color:inherit;font:inherit;font-size:13px;padding:8px 12px;cursor:pointer}.bar button.on{background:#2c3b63}
input,select{background:#0e1016;border:1px solid #303648;color:inherit;border-radius:7px;padding:8px 10px;font:inherit}input{flex:1;min-width:220px}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 16px}
.champ{background:linear-gradient(160deg,#2a2412,#161922);border:1px solid #5a4a20;border-radius:12px;padding:14px 16px}
.champ .r{color:#f2c14e;font-size:13px;font-weight:700}.champ .n{font-size:21px;font-weight:700;margin:4px 0}.champ .v{font-size:26px;color:#f2c14e;font-weight:700}
.champ .m{color:#9aa3b5;font-size:13px}
table{width:100%;border-collapse:collapse;background:#161922;border:1px solid #252a37;border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #20242f;font-size:14px}th{color:#9aa3b5;font-weight:600;cursor:pointer;user-select:none;background:#12151c;position:sticky;top:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}tr:hover td{background:#1b1f2a}
.L{color:#4f8cff}.F{color:#ff5a4a}a.p{text-decoration:none;font-weight:600}a.p:hover{text-decoration:underline}
.fl{display:inline-block;background:#2a2412;color:#f2c14e;border:1px solid #5a4a20;border-radius:6px;font-size:12px;font-weight:700;padding:1px 7px;margin-left:6px;text-decoration:none}
.muted{color:#9aa3b5}.g{color:#f2c14e;font-weight:700}
.more{display:block;margin:14px auto;border:0;border-radius:8px;background:#2c3b63;color:#fff;padding:10px 18px;font:inherit;cursor:pointer}
@media(max-width:800px){.top3{grid-template-columns:1fr}.hide-s{display:none}}
.subm{display:none;color:#9aa3b5;font-size:12px;margin-top:2px}
@media(max-width:640px){header{padding:12px 12px 4px}main{padding:6px 10px 30px}h1{font-size:22px}nav{gap:12px;font-size:13px}
 .top3{gap:8px}.champ{padding:10px 12px}.champ .n{font-size:18px}.champ .v{font-size:22px}
 .bar{gap:6px}.bar button{padding:7px 10px;font-size:12px}input{min-width:0;flex-basis:100%}select{flex:1 1 30%;min-width:0;font-size:13px;padding:7px 6px}
 th,td{padding:7px 6px;font-size:13px}.hide-m{display:none}.subm{display:block}
 body.by-rating .c-gold,body.by-gold .c-rating{display:none}}
</style></head><body class="by-rating">
<header><nav><a href="./" id="mn">Menu</a><a href="tower" id="tw">The Tower</a><b>Strongest of the Tower</b><a href="fallen" id="fa">Hall of the Fallen</a></nav>
<h1 id="ttl">Strongest of the Tower</h1><div class="sub" id="sub">Everyone alive on all twenty floors, ranked by battle rating.</div></header>
<main>
<div class="top3" id="top3"></div>
<div class="bar" id="by"><span class="muted" style="margin-right:4px">Rank by</span><button data-b="rating" class="on">&#9876;&#65039; Battle rating</button><button data-b="gold">&#128176; Richest (gold)</button></div>
<div class="bar" id="cls"></div>
<div class="bar"><input id="q" type="search" placeholder="Find someone by name or house">
<select id="side"><option value="">Both sides</option><option value="0">Light</option><option value="1">Fury</option></select>
<select id="fl"><option value="">All floors</option></select>
<select id="age"><option value="16">Adults (16+)</option><option value="0">All ages</option><option value="u25">Rising stars (under 25)</option><option value="l81">The Unbound (level 81+)</option></select></div>
<table><thead><tr><th data-s="rank">#</th><th data-s="name">Name</th><th class="hide-m" data-s="job">Class</th><th class="n hide-m" data-s="level">Level</th><th class="n hide-s" data-s="age">Age</th><th class="n hide-s" data-s="gear">Gear</th><th class="n hide-s" data-s="ench">Weapon / armour</th><th class="n c-gold" data-s="gold">Gold</th><th class="n c-rating" data-s="rating">Battle rating</th></tr></thead><tbody id="tb"></tbody></table>
<button class="more" id="more">Show more</button>
</main>
<script>
const LOCAL=location.port==='8091'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
if(LOCAL){mn.href='/';tw.href='/tower';fa.href='/fallen'}
const JOBS=['Fighter','Defender','Ranger','Archer','Mage','Priest'],esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]),fmt=n=>(n||0).toLocaleString();
const pad=n=>String(n).padStart(2,'0'),link=r=>(LOCAL?'/floor/':'floor/')+pad(r.floor)+'/people.html#p-'+r.k;
let A=[],cls=-1,sort='rating',dir=-1,shown=200,by='rating';
const big=n=>n>=1e12?(n/1e12).toFixed(2)+' T':n>=1e9?(n/1e9).toFixed(2)+' B':n>=1e6?(n/1e6).toFixed(1)+' M':fmt(Math.round(n));
document.getElementById('cls').innerHTML=['All classes',...JOBS].map((n,i)=>`<button data-c="${i-1}" class="${i?'':'on'}">${n}</button>`).join('');
for(let n=1;n<=20;n++)fl.insertAdjacentHTML('beforeend',`<option value="${n}">Floor ${n}</option>`);
function pick(){const s=q.value.toLowerCase(),sd=side.value,f=fl.value,ag=age.value;
 return A.filter(r=>(cls<0||r.job==cls)&&(sd===''||r.fac==sd)&&(!f||r.floor==f)&&(ag==='u25'?r.age<25&&r.age>=16:ag==='l81'?r.level>80:r.age>=+ag)&&(!s||(r.name+' '+r.house).toLowerCase().includes(s)));}
function draw(){const L=pick().sort((a,b)=>{const v=x=>sort==='ench'?x.ew*100+x.ea:sort==='name'?x.name:sort==='job'?x.job:sort==='rank'?-x[by]:x[sort];
 const p=v(a),q2=v(b);return (p>q2?1:p<q2?-1:0)*dir||b.rating-a.rating});
 const byR=[...L].sort((a,b)=>b[by]-a[by]);const rank=new Map(byR.map((r,i)=>[r,i+1]));
 document.getElementById('top3').innerHTML=byR.slice(0,3).map((r,i)=>`<div class="champ"><div class="r">${['&#129351; #1','&#129352; #2','&#129353; #3'][i]}${cls>=0?' '+JOBS[cls]:''}</div><div class="n"><a class="p ${r.fac?'F':'L'}" href="${link(r)}">${esc(r.name)}</a><a class="fl" href="${link(r)}">F${r.floor}</a></div><div class="m">House ${esc(r.house)} · ${r.fac?'Fury':'Light'} ${JOBS[r.job]} · level ${r.level} · age ${r.age}</div><div class="v">${by==='gold'?big(r.gold)+' gold':fmt(r.rating)}</div>${by==='gold'?`<div class="m">rating ${fmt(r.rating)} · ${fmt(r.lapis)} lapis · ${fmt(r.lapisia)} lapisia</div>`:''}</div>`).join('');
 document.getElementById('tb').innerHTML=L.slice(0,shown).map(r=>`<tr><td class="muted">${rank.get(r)}</td><td><a class="p ${r.fac?'F':'L'}" href="${link(r)}">${esc(r.name)}</a><a class="fl" href="${link(r)}" title="Floor ${r.floor}">F${r.floor}</a> <span class="muted">${esc(r.house)}</span><div class="subm">${r.fac?'Fury':'Light'} ${JOBS[r.job]} · lv ${r.level} · age ${r.age}</div></td><td class="hide-m">${JOBS[r.job]}</td><td class="n hide-m">${r.level}</td><td class="n hide-s">${r.age}</td><td class="n hide-s">${r.gear}</td><td class="n hide-s">+${r.ew} / +${r.ea}</td><td class="n c-gold" style="${by==='gold'?'color:#f2c14e;font-weight:700':''}">${big(r.gold)}</td><td class="n c-rating ${by==='rating'?'g':''}">${fmt(r.rating)}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Nobody matches.</td></tr>';
 more.style.display=L.length>shown?'':'none';more.textContent=`Show more (${fmt(L.length-shown)} left)`;}
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{by=b.dataset.b;sort=by;dir=-1;document.querySelectorAll('[data-b]').forEach(x=>x.classList.toggle('on',x===b));
 ttl.textContent=by==='gold'?'Richest of the Tower':'Strongest of the Tower';document.body.className='by-'+by;shown=200;draw()});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cls=+b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));shown=200;draw()});
document.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{const s=t.dataset.s;dir=sort===s?-dir:(s==='name'||s==='job'||s==='rank'?1:-1);sort=s;draw()});
[q,side,fl,age].forEach(e=>e.oninput=()=>{shown=200;draw()});more.onclick=()=>{shown+=300;draw()};
function load(){fetch(LOCAL?'/strongest.json':'strongest.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{A=d.people;
 sub.textContent=`Year ${d.year}. ${fmt(A.length)} people alive on all twenty floors, ranked by ${by==='gold'?'gold':'battle rating'}. Click a name or its floor badge to open their profile.`;draw()})
 .catch(()=>sub.textContent='The rankings could not be loaded.');}
load();setInterval(()=>{if(document.activeElement!==q)load()},120000);
</script><a id="menubtn" href="index.html" style="position:fixed;right:14px;bottom:14px;z-index:99999;background:#151a28;border:1px solid #c9a54a;color:#f1dfa8;padding:8px 15px;border-radius:20px;font:600 14px Segoe UI,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.5)">&#9776; Menu</a><script>(function(){var H='index.html';function tag(){document.querySelectorAll('h1,h2').forEach(function(h){if(h.dataset.mb||h.closest('a,button,#menubtn,.no-menu'))return;h.dataset.mb=1;var a=document.createElement('a');a.href=H;a.className='secmenu';a.textContent='☰ Menu';h.appendChild(a)})}
var s=document.createElement('style');s.textContent='.secmenu{display:inline-block;margin-left:12px;vertical-align:middle;font:600 11px Segoe UI,sans-serif;letter-spacing:.3px;color:#f1dfa8!important;background:#151a28;border:1px solid #c9a54a;border-radius:12px;padding:2px 9px;text-decoration:none!important;opacity:.75;text-transform:none}.secmenu:hover{opacity:1;background:#232a40}';document.head.appendChild(s);
tag();var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(tag,150)}).observe(document.body,{childList:true,subtree:true})})();</script><style id="mfx">
@media(max-width:760px){
 body{overflow-wrap:break-word;-webkit-text-size-adjust:100%}
 td,th{overflow-wrap:normal;word-break:normal}
 img,video,canvas{max-width:100%;height:auto}
 svg{max-width:100%;height:auto}
 .mscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
 nav{flex-wrap:wrap;row-gap:6px}
 .secmenu{display:none!important}
 #menubtn,a[href][style*="position:fixed"][style*="bottom:14px"]{padding:6px 12px!important;font-size:13px!important;right:10px!important;bottom:10px!important}
}
.flpick{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
.flpick button,.flpick select{background:#20242f;color:#e8e9ee;border:1px solid #303648;border-radius:7px;padding:4px 8px;font:inherit;font-size:13px;cursor:pointer}
.flpick button:disabled{opacity:.3;cursor:default}
</style>
<script>(function(){
var W=function(){return window.innerWidth};
function fit(){
 if(W()>760)return;
 document.querySelectorAll('table').forEach(function(t){
  if(t.dataset.mw||t.closest('.mscroll'))return;var p=t.parentElement;if(!p)return;
  var o=getComputedStyle(p).overflowX;if(o==='auto'||o==='scroll')return;
  if(t.scrollWidth>p.clientWidth+2){var d=document.createElement('div');d.className='mscroll';p.insertBefore(d,t);d.appendChild(t);t.dataset.mw=1}});
 document.querySelectorAll('body *').forEach(function(e){                       // grids squeezed into slivers: let them stack
   if(e.closest('.mscroll,svg')||e.classList.contains('floors')||e.dataset.mg)return;
   var cs=getComputedStyle(e);if(cs.display.indexOf('grid')<0)return;
   var cols=cs.gridTemplateColumns.split(' ').filter(function(x){return x&&x!=='none'}).map(parseFloat);
   if(cols.length<2)return;var mn=Math.min.apply(null,cols);
   var heavy=e.querySelector('svg,table,canvas,img');
   if(heavy&&mn<260){e.style.gridTemplateColumns='minmax(0,1fr)';e.dataset.mg=1}
   else if(mn<110){e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,140px),1fr))';e.dataset.mg=1}});
 for(var pass=0;pass<2;pass++){
  document.querySelectorAll('body *').forEach(function(e){
   if(e.closest('.mscroll,svg')||e.tagName==='TABLE'||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
   var r=e.getBoundingClientRect();if(r.width<=W()+1)return;
   var cs=getComputedStyle(e);
   if(cs.position==='fixed')return;
   if(cs.display.indexOf('grid')>=0)e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,150px),1fr))';
   else if(cs.display.indexOf('flex')>=0)e.style.flexWrap='wrap';
   if(e.tagName==='svg'||e.tagName==='SVG'){e.style.width='100%';e.style.height='auto'}
   else{e.style.maxWidth='100%';e.style.minWidth='0';e.style.boxSizing='border-box'}});
 }}
function floors(){
 var m=location.pathname.match(/\/floor\/(\d\d)\/([^\/]*)$/);
 if(!m||document.getElementById('flsel')||document.querySelector('.flpick'))return;
 var n=+m[1],page=m[2]||'',pad=function(k){return(k<10?'0':'')+k};
 var s=document.createElement('span');s.className='flpick';
 var o='';for(var k=1;k<=20;k++)o+='<option value="'+k+'"'+(k===n?' selected':'')+'>Floor '+k+'</option>';
 s.innerHTML='<button aria-label="Previous floor"'+(n<=1?' disabled':'')+'>&larr;</button><select aria-label="Choose a floor">'+o+'</select><button aria-label="Next floor"'+(n>=20?' disabled':'')+'>&rarr;</button>';
 var go=function(k){location.href='../'+pad(k)+'/'+page};
 var b=s.querySelectorAll('button');b[0].onclick=function(){go(n-1)};b[1].onclick=function(){go(n+1)};s.querySelector('select').onchange=function(){go(+this.value)};
 var nav=document.querySelector('nav');
 if(nav){nav.style.display=nav.style.display||'flex';nav.style.flexWrap='wrap';nav.style.alignItems='center';nav.appendChild(s)}
 else{var h=document.querySelector('h1');if(h)h.parentElement.insertBefore(s,h.nextSibling)}}
function run(){try{floors()}catch(e){}try{fit()}catch(e){}}
if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
window.addEventListener('load',run);var t=null;
new MutationObserver(function(){clearTimeout(t);t=setTimeout(function(){try{fit()}catch(e){}},300)}).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(run,300)});
})();</script></body></html>
