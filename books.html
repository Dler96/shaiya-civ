<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Library of the Tower</title>
<style>
:root{--bg:#0b0f1a;--panel:#131a2b;--line:#2a3150;--gold:#c9a54a;--soft:#a9a6b8;--ink:#2b2418;--paper:#f3ead6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8e2d0;font:15px Inter,Segoe UI,sans-serif}
header{padding:20px 28px 10px;max-width:1400px;margin:auto}h1{font-family:Georgia,serif;color:#f1dfa8;margin:4px 0 2px;font-size:30px}
nav a{color:var(--gold);text-decoration:none;font-weight:600}.sub{color:var(--soft);margin:4px 0 0}
.wrap{display:grid;grid-template-columns:330px 1fr;gap:18px;max-width:1400px;margin:auto;padding:12px 28px 40px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;height:calc(100vh - 150px);overflow:auto;position:sticky;top:12px}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
input,select{background:#0e1422;border:1px solid var(--line);color:#e8e2d0;border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.tabs{display:flex;gap:6px}.tabs button{flex:1;background:#0e1422;border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:7px;font:inherit;cursor:pointer}
.tabs button.on{border-color:var(--gold);color:#f1dfa8}
.g{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:14px 4px 6px}
.b{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:#e8e2d0;border-radius:8px;padding:7px 9px;cursor:pointer;font:inherit}
.b:hover{background:#1a2236}.b.on{background:#211d12;border-color:#5a4a20}.b small{display:block;color:var(--soft);font-size:12px}
.read{background:var(--paper);color:var(--ink);border-radius:12px;padding:38px 56px;min-height:calc(100vh - 150px);font:18px/1.7 Georgia,'Times New Roman',serif;box-shadow:0 10px 40px #0008}
.read h2{font-size:34px;margin:0 0 4px;color:#3a2a10}.meta{font:14px Inter,Segoe UI,sans-serif;color:#7a6a4a;margin-bottom:18px}
.about{font-style:italic;color:#5a4a2a;margin:0 0 20px}.toc{font:15px Inter,Segoe UI,sans-serif;background:#ebe0c6;border-radius:10px;padding:12px 16px;margin-bottom:26px}
.toc a{color:#6b4e12;text-decoration:none;display:block;padding:2px 0}.toc a:hover{text-decoration:underline}
.ch h3{font-size:24px;color:#4a3412;border-bottom:1px solid #d8c9a4;padding-bottom:6px;margin:34px 0 12px}.ch p{margin:0 0 .55em;text-indent:1.4em}
.qa{font:15px Inter,Segoe UI,sans-serif;background:#ebe0c6;border-left:4px solid #b08a3a;border-radius:6px;padding:10px 14px;margin:16px 0}
.qa b{display:block;color:#4a3412;margin-bottom:4px}.qa details{margin:4px 0}.qa summary{cursor:pointer}.qa summary::marker{color:#b08a3a}
.pager{display:flex;justify-content:space-between;margin-top:34px;font:15px Inter,Segoe UI,sans-serif}.pager button{background:#3a2a10;color:var(--paper);border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.pager button:disabled{opacity:.3;cursor:default}.wip{font:14px Inter,sans-serif;color:#8a5a1a;background:#f7dfa8;border-radius:8px;padding:6px 10px;display:inline-block}
.news{border-bottom:1px solid #d8c9a4;padding:14px 0}.news h4{margin:0 0 6px;font-size:20px;color:#3a2a10}.news p{margin:0 0 .3em}
.saying{font-style:italic;padding:10px 0;border-bottom:1px dashed #d8c9a4}
.empty{color:#7a6a4a;font-style:italic}
@media(max-width:860px){.wrap{grid-template-columns:1fr}aside{height:auto;position:static;max-height:45vh}.read{padding:24px 22px}}
</style></head><body>
<header><nav><a href="./" id="menu">&larr; Menu</a></nav><h1>The Library of the Tower</h1>
<div class="sub">Every book the citizens read at school, written chapter by chapter for each age, class and role, plus the Tower Herald and the Wanderer's sayings.</div></header>
<div class="wrap"><aside><div class="tools">
<div class="tabs"><button id="tBooks" class="on">Books</button><button id="tNews">Herald</button><button id="tSay">Wanderer</button></div>
<input id="q" placeholder="Search titles and text...">
<select id="age"><option value="">Any age</option><option value="6">Little ones (6)</option><option value="10">Children (10)</option><option value="15">Youths (15)</option><option value="25">Adults</option></select>
</div><div id="list"><div class="empty" style="color:var(--soft)">Opening the shelves...</div></div></aside>
<main class="read no-menu" id="read"><div class="empty">Choose a book from the shelves.</div></main></div>
<script>
const LOCAL=location.port==='8091'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
if(LOCAL)document.getElementById('menu').href='/';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let D={books:[],herald:[],sayings:[]},tab='books',cur=null;
const ageTxt=a=>a[1]>90?`ages ${a[0]}+`:`ages ${a[0]}–${a[1]}`;
function listBooks(){const q=document.getElementById('q').value.toLowerCase(),ag=+document.getElementById('age').value||0;
 const B=D.books.filter(b=>(!ag||(b.ages[0]<=ag&&ag<=b.ages[1]))&&(!q||(b.title+' '+b.about+' '+b.chapters.map(c=>c.title+' '+c.lines.join(' ')).join(' ')).toLowerCase().includes(q)));
 const G={};B.forEach(b=>(G[b.genre]=G[b.genre]||[]).push(b));
 document.getElementById('list').innerHTML=Object.keys(G).sort().map(g=>`<div class="g">${esc(g)} (${G[g].length})</div>`+G[g].map(b=>`<button class="b${cur===b.id?' on':''}" data-id="${esc(b.id)}">${esc(b.title)}<small>${ageTxt(b.ages)} · ${b.chapters.length}${b.plan&&b.plan.length>b.chapters.length?'/'+b.plan.length:''} chapters</small></button>`).join('')).join('')||'<div class="empty" style="color:var(--soft)">No book matches.</div>';
 document.querySelectorAll('.b').forEach(e=>e.onclick=()=>openBook(e.dataset.id));}
function openBook(id){const b=D.books.find(x=>x.id===id);if(!b)return;cur=id;listBooks();
 const i=D.books.indexOf(b),R=document.getElementById('read');
 const parts=b.chapters.map((c,k)=>`<div class="ch" id="c${k}"><h3>${k+1}. ${esc(c.title)}</h3>${c.lines.map(l=>`<p>${esc(l)}</p>`).join('')}${(c.qa||[]).length?`<div class="qa"><b>Questions for the reader</b>${c.qa.map(([q,a])=>`<details><summary>${esc(q)}</summary>${esc(a)}</details>`).join('')}</div>`:''}</div>`).join('');
 const left=b.plan&&b.plan.length>b.chapters.length?`<div class="wip">Still being written: ${b.chapters.length} of ${b.plan.length} chapters</div>`:'';
 R.innerHTML=`<h2>${esc(b.title)}</h2><div class="meta">${esc(b.genre)} · ${ageTxt(b.ages)}${b.roles?' · for '+b.roles.map(esc).join(', '):''}</div>${b.about?`<p class="about">${esc(b.about)}</p>`:''}${left}
 <div class="toc">${b.chapters.map((c,k)=>`<a href="#c${k}">${k+1}. ${esc(c.title)}</a>`).join('')}</div>${parts}
 <div class="pager"><button id="prev" ${i?'':'disabled'}>&larr; Previous book</button><button id="next" ${i<D.books.length-1?'':'disabled'}>Next book &rarr;</button></div>`;
 document.getElementById('prev').onclick=()=>openBook(D.books[i-1].id);document.getElementById('next').onclick=()=>openBook(D.books[i+1].id);
 R.querySelectorAll('.toc a').forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute('href')).scrollIntoView({behavior:'smooth'})});
 window.scrollTo({top:0});history.replaceState(null,'','#'+encodeURIComponent(id));}
function showNews(){document.getElementById('list').innerHTML=`<div class="empty" style="color:var(--soft)">${D.herald.length} issues, newest first.</div>`;
 document.getElementById('read').innerHTML='<h2>The Tower Herald</h2><div class="meta">News of all twenty floors, written every hour of the world.</div>'+(D.herald.map(n=>`<div class="news"><h4>${esc(n.headline||'News')}</h4>${n.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`).join('')||'<div class="empty">No issues yet.</div>');}
function showSay(){document.getElementById('list').innerHTML=`<div class="empty" style="color:var(--soft)">${D.sayings.length} words left behind.</div>`;
 document.getElementById('read').innerHTML='<h2>Sayings of the Wanderer</h2><div class="meta">The grey-cloaked traveller who walks every floor.</div>'+(D.sayings.map(s=>`<div class="saying">“${esc(s.text)}”</div>`).join('')||'<div class="empty">The Wanderer has said nothing yet.</div>');}
function setTab(t){tab=t;['Books','News','Say'].forEach(n=>document.getElementById('t'+n).classList.toggle('on',t===n.toLowerCase()));
 document.getElementById('q').style.display=document.getElementById('age').style.display=t==='books'?'':'none';
 if(t==='books'){listBooks();cur?openBook(cur):document.getElementById('read').innerHTML='<div class="empty">Choose a book from the shelves.</div>'}else if(t==='news')showNews();else showSay();}
document.getElementById('tBooks').onclick=()=>setTab('books');document.getElementById('tNews').onclick=()=>setTab('news');document.getElementById('tSay').onclick=()=>setTab('say');
document.getElementById('q').oninput=listBooks;document.getElementById('age').onchange=listBooks;
fetch(LOCAL?'/books.json':'books.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{D=d;listBooks();const h=decodeURIComponent(location.hash.slice(1));
 if(h&&D.books.find(b=>b.id===h))openBook(h);else document.getElementById('read').innerHTML=`<h2>Welcome</h2><p>${D.books.length} books on the shelves, ${D.books.reduce((s,b)=>s+b.chapters.length,0)} chapters in all. Pick one on the left, search for a word, or narrow by age.</p><p>The questions at the end of each chapter are the same ones the pupils answer. Click a question to see its answer.</p>`;})
.catch(()=>document.getElementById('list').innerHTML='<div class="empty" style="color:var(--soft)">The shelves could not be opened.</div>');
</script><a id="menubtn" href="index.html" style="position:fixed;right:14px;bottom:14px;z-index:99999;background:#151a28;border:1px solid #c9a54a;color:#f1dfa8;padding:8px 15px;border-radius:20px;font:600 14px Segoe UI,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.5)">&#9776; Menu</a><script>(function(){var H='index.html';function tag(){document.querySelectorAll('h1,h2').forEach(function(h){if(h.dataset.mb||h.closest('a,button,#menubtn,.no-menu'))return;h.dataset.mb=1;var a=document.createElement('a');a.href=H;a.className='secmenu';a.textContent='☰ Menu';h.appendChild(a)})}
var s=document.createElement('style');s.textContent='.secmenu{display:inline-block;margin-left:12px;vertical-align:middle;font:600 11px Segoe UI,sans-serif;letter-spacing:.3px;color:#f1dfa8!important;background:#151a28;border:1px solid #c9a54a;border-radius:12px;padding:2px 9px;text-decoration:none!important;opacity:.75;text-transform:none}.secmenu:hover{opacity:1;background:#232a40}';document.head.appendChild(s);
tag();var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(tag,150)}).observe(document.body,{childList:true,subtree:true})})();</script><style id="mfx">
@media(max-width:760px){
 body{overflow-wrap:break-word;-webkit-text-size-adjust:100%}
 td,th{overflow-wrap:normal;word-break:normal}
 img,video,canvas{max-width:100%;height:auto}
 svg{max-width:100%;height:auto}
 .mscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
 nav{flex-wrap:wrap;row-gap:6px}
 .secmenu{display:none!important}
 #menubtn,a[href][style*="position:fixed"][style*="bottom:14px"]{padding:6px 12px!important;font-size:13px!important;right:10px!important;bottom:10px!important}
}
.flpick{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
.flpick button,.flpick select{background:#20242f;color:#e8e9ee;border:1px solid #303648;border-radius:7px;padding:4px 8px;font:inherit;font-size:13px;cursor:pointer}
.flpick button:disabled{opacity:.3;cursor:default}
</style>
<script>(function(){
var W=function(){return window.innerWidth};
function fit(){
 if(W()>760)return;
 document.querySelectorAll('table').forEach(function(t){
  if(t.dataset.mw||t.closest('.mscroll'))return;var p=t.parentElement;if(!p)return;
  var o=getComputedStyle(p).overflowX;if(o==='auto'||o==='scroll')return;
  if(t.scrollWidth>p.clientWidth+2){var d=document.createElement('div');d.className='mscroll';p.insertBefore(d,t);d.appendChild(t);t.dataset.mw=1}});
 document.querySelectorAll('body *').forEach(function(e){                       // grids squeezed into slivers: let them stack
   if(e.closest('.mscroll,svg')||e.classList.contains('floors')||e.dataset.mg)return;
   var cs=getComputedStyle(e);if(cs.display.indexOf('grid')<0)return;
   var cols=cs.gridTemplateColumns.split(' ').filter(function(x){return x&&x!=='none'}).map(parseFloat);
   if(cols.length<2)return;var mn=Math.min.apply(null,cols);
   var heavy=e.querySelector('svg,table,canvas,img');
   if(heavy&&mn<260){e.style.gridTemplateColumns='minmax(0,1fr)';e.dataset.mg=1}
   else if(mn<110){e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,140px),1fr))';e.dataset.mg=1}});
 for(var pass=0;pass<2;pass++){
  document.querySelectorAll('body *').forEach(function(e){
   if(e.closest('.mscroll,svg')||e.tagName==='TABLE'||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
   var r=e.getBoundingClientRect();if(r.width<=W()+1)return;
   var cs=getComputedStyle(e);
   if(cs.position==='fixed')return;
   if(cs.display.indexOf('grid')>=0)e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,150px),1fr))';
   else if(cs.display.indexOf('flex')>=0)e.style.flexWrap='wrap';
   if(e.tagName==='svg'||e.tagName==='SVG'){e.style.width='100%';e.style.height='auto'}
   else{e.style.maxWidth='100%';e.style.minWidth='0';e.style.boxSizing='border-box'}});
 }}
function floors(){
 var m=location.pathname.match(/\/floor\/(\d\d)\/([^\/]*)$/);
 if(!m||document.getElementById('flsel')||document.querySelector('.flpick'))return;
 var n=+m[1],page=m[2]||'',pad=function(k){return(k<10?'0':'')+k};
 var s=document.createElement('span');s.className='flpick';
 var o='';for(var k=1;k<=20;k++)o+='<option value="'+k+'"'+(k===n?' selected':'')+'>Floor '+k+'</option>';
 s.innerHTML='<button aria-label="Previous floor"'+(n<=1?' disabled':'')+'>&larr;</button><select aria-label="Choose a floor">'+o+'</select><button aria-label="Next floor"'+(n>=20?' disabled':'')+'>&rarr;</button>';
 var go=function(k){location.href='../'+pad(k)+'/'+page};
 var b=s.querySelectorAll('button');b[0].onclick=function(){go(n-1)};b[1].onclick=function(){go(n+1)};s.querySelector('select').onchange=function(){go(+this.value)};
 var nav=document.querySelector('nav');
 if(nav){nav.style.display=nav.style.display||'flex';nav.style.flexWrap='wrap';nav.style.alignItems='center';nav.appendChild(s)}
 else{var h=document.querySelector('h1');if(h)h.parentElement.insertBefore(s,h.nextSibling)}}
function run(){try{floors()}catch(e){}try{fit()}catch(e){}}
if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
window.addEventListener('load',run);var t=null;
new MutationObserver(function(){clearTimeout(t);t=setTimeout(function(){try{fit()}catch(e){}},300)}).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(run,300)});
})();</script></body></html>
