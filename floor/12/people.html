function feelOf(x){if(!x.emo.length)return '<p class="sub">Feelings begin from this version on.</p>';const v=x.emo.slice(0,8).concat([x.emo[9]]);const nm=EMO.concat(['Fear']);

<div class="box gear"><h3>Equipment (item level ${Math.round(x.gear)})</h3>${gearOf(x)}<p class="sub">The simulation tracks one gear level; these are the best real ${FAC[x.fac]} ${JOBS[x.job]} items at that level.</p></div>

${D.floor?`<div class="box"><h3>Journey through the Tower</h3>${jrOf(x)}</div>`:''}

<span>Children</span><span>${ch}</span><span>Born</span><span>${x.gen==0&&x.born<=0?'founding generation':'year '+x.born}</span></div></div></div>`;
for(const b of el.querySelectorAll('[data-go]'))b.onclick=()=>{show(+b.dataset.go);el.scrollIntoView({behavior:'smooth'})};

q.oninput=list;list();show(x.k)}else{

<script>(function(){

 for(var pass=0;pass<2;pass++){

 }}
