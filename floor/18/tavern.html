<script>(function(){
var W=function(){return window.innerWidth};
function fit(){
 if(W()>760)return;
 document.querySelectorAll('table').forEach(function(t){
  if(t.dataset.mw||t.closest('.mscroll'))return;var p=t.parentElement;if(!p)return;
  var o=getComputedStyle(p).overflowX;if(o==='auto'||o==='scroll')return;
  if(t.scrollWidth>p.clientWidth+2){var d=document.createElement('div');d.className='mscroll';p.insertBefore(d,t);d.appendChild(t);t.dataset.mw=1}});
 document.querySelectorAll('body *').forEach(function(e){                       // grids squeezed into slivers: let them stack
   if(e.closest('.mscroll,svg')||e.classList.contains('floors')||e.dataset.mg)return;
   var cs=getComputedStyle(e);if(cs.display.indexOf('grid')<0)return;
   var cols=cs.gridTemplateColumns.split(' ').filter(function(x){return x&&x!=='none'}).map(parseFloat);
   if(cols.length<2)return;var mn=Math.min.apply(null,cols);
   var heavy=e.querySelector('svg,table,canvas,img');
   if(heavy&&mn<260){e.style.gridTemplateColumns='minmax(0,1fr)';e.dataset.mg=1}
   else if(mn<110){e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,140px),1fr))';e.dataset.mg=1}});
 for(var pass=0;pass<2;pass++){
  document.querySelectorAll('body *').forEach(function(e){
   if(e.closest('.mscroll,svg')||e.tagName==='TABLE'||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
   var r=e.getBoundingClientRect();if(r.width<=W()+1)return;
   var cs=getComputedStyle(e);
   if(cs.position==='fixed')return;
   if(cs.display.indexOf('grid')>=0)e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,150px),1fr))';
   else if(cs.display.indexOf('flex')>=0)e.style.flexWrap='wrap';
   if(e.tagName==='svg'||e.tagName==='SVG'){e.style.width='100%';e.style.height='auto'}
   else{e.style.maxWidth='100%';e.style.minWidth='0';e.style.boxSizing='border-box'}});
 }}
function floors(){
 var m=location.pathname.match(/\/floor\/(\d\d)\/([^\/]*)$/);
 if(!m||document.getElementById('flsel')||document.querySelector('.flpick'))return;
 var n=+m[1],page=m[2]||'',pad=function(k){return(k<10?'0':'')+k};
 var s=document.createElement('span');s.className='flpick';
 var o='';for(var k=1;k<=20;k++)o+='<option value="'+k+'"'+(k===n?' selected':'')+'>Floor '+k+'</option>';
 s.innerHTML='<button aria-label="Previous floor"'+(n<=1?' disabled':'')+'>&larr;</button><select aria-label="Choose a floor">'+o+'</select><button aria-label="Next floor"'+(n>=20?' disabled':'')+'>&rarr;</button>';
 var go=function(k){location.href='../'+pad(k)+'/'+page};
 var b=s.querySelectorAll('button');b[0].onclick=function(){go(n-1)};b[1].onclick=function(){go(n+1)};s.querySelector('select').onchange=function(){go(+this.value)};
 var nav=document.querySelector('nav');
 if(nav){nav.style.display=nav.style.display||'flex';nav.style.flexWrap='wrap';nav.style.alignItems='center';nav.appendChild(s)}
 else{var h=document.querySelector('h1');if(h)h.parentElement.insertBefore(s,h.nextSibling)}}
function run(){try{floors()}catch(e){}try{fit()}catch(e){}}
if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
window.addEventListener('load',run);var t=null;
new MutationObserver(function(){clearTimeout(t);t=setTimeout(function(){try{fit()}catch(e){}},300)}).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(run,300)});
})();</script></body></html>
