lthy and not shaken, below 70: monsters slightly above me give the best experience","say":"feeling good, hunting tougher stuff for the exp"},{"id":"young_even","think":"even monsters are the steady middle: good experience, low risk","say":"grinding even mobs, steady exp"},{"id":"young_no_craft","think":"any enchant i do now is lost when i replace this gear at the next level; keep my materials for 80","say":"not enchanting yet, saving it all for 80"},{"id":"young_sell","think":"i cannot use lapisia for years, and rich level 80s pay a fortune for it; gold buys me gear now","say":"selling my lapisia, rich 80s pay well"},{"id":"fill_links","think":"empty link slots are free stats waiting; linking is cheap compared to enchanting, do it first","say":"filling my link slots first, free stats"},{"id":"even_ench","think":"weapon and armour should stay even: the lower one gains the most from each success","say":"enchanting whichever piece is lower"},{"id":"farm_when_dry","think":"no lapisia and the market is expensive; farming quadruples drops, and at 80 experience barely matters anymore","say":"out of lapisia, farming for a while"},{"id":"stop_high","think":"past +14 each try fails most of the time and breaks levels; without a big stock it is cheaper to stop and save","say":"not risking +15 without a full bag"},{"id":"rich_buy","think":"i have more gold than i can ever use; buying a ready enchanted piece beats years of failed tries","say":"rich enough to just buy the enchant lol"},{"id":"hoard_lapis","think":"my slots are full and i keep piling lapis; someone else needs it more and will pay","say":"selling spare lapis, i got way too much"},{"id":"lonely_town","think":"i keep hunting alone and it is wearing me down; town is where people meet","say":"going to town, need to see some ppl"},{"id":"grief_friends","think":"losing someone is easier with others around; i should not be alone right now","say":"gonna go find my friends"},{"id":"joy_share","think":"good news is better shared; telling friends makes them happy too","say":"guys guess what happened lol"},{"id":"envy_work","think":"my friends are stronger; envy is useless unless it makes me work, so farm and catch up","say":"everyone is ahead of me, time to farm"},{"id":"elder_teach","think":"i have seen enough to know what works; the young should not repeat my mistakes","say":"listen kid, dont enchant before 80"},{"id":"partner_time","think":"we barely talk anymore; love fades if nobody tends to it","say":"gonna spend some time with my partner"},{"id":"outgrown","think":"the monsters here give almost no experience for my level; staying is wasting hours","say":"this map is too easy now, moving on"}],"mentors":{"rows":[],"history":[{"year":897,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":1,"knows_0":0.977,"independence_0":0.977,"solo_0":true,"knows_1":0.976,"independence_1":0.976,"solo_1":true},{"year":898,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":0,"knows_0":0.971,"independence_0":0.971,"solo_0":true,"knows_1":0.973,"independence_1":0.973,"solo_1":true},{"year":899,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":1,"knows_0":0.976,"independence_0":0.976,"solo_0":true,"knows_1":0.982,"independence_1":0.982,"solo_1":true},{"year":900,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":1,"knows_0":0.979,"independence_0":0.979,"solo_0":true,"knows_1":0.987,"independence_1":0.987,"solo_1":true},{"year":901,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":0,"knows_0":0.98,"independence_0":0.98,"solo_0":true,"knows_1":0.978,"independence_1":0.978,"solo_1":true},{"year":902,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":0,"knows_0":0.973,"independence_0":0.973,"solo_0":true,"knows_1":0.98,"independence_1":0.98,"solo_1":true},{"year":903,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":1,"knows_0":0.972,"independence_0":0.972,"solo_0":true,"knows_1":0.974,"independence_1":0.97 <script>(function(){
var W=function(){return window.innerWidth};
function fit(){
 if(W()>760)return;
 document.querySelectorAll('table').forEach(function(t){
  if(t.dataset.mw||t.closest('.mscroll'))return;var p=t.parentElement;if(!p)return;
  var o=getComputedStyle(p).overflowX;if(o==='auto'||o==='scroll')return;
  if(t.scrollWidth>p.clientWidth+2){var d=document.createElement('div');d.className='mscroll';p.insertBefore(d,t);d.appendChild(t);t.dataset.mw=1}});
 document.querySelectorAll('body *').forEach(function(e){                       // grids squeezed into slivers: let them stack
   if(e.closest('.mscroll,svg')||e.classList.contains('floors')||e.dataset.mg)return;
   var cs=getComputedStyle(e);if(cs.display.indexOf('grid')<0)return;
   var cols=cs.gridTemplateColumns.split(' ').filter(function(x){return x&&x!=='none'}).map(parseFloat);
   if(cols.length<2)return;var mn=Math.min.apply(null,cols);
   var heavy=e.querySelector('svg,table,canvas,img');
   if(heavy&&mn<260){e.style.gridTemplateColumns='minmax(0,1fr)';e.dataset.mg=1}
   else if(mn<110){e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,140px),1fr))';e.dataset.mg=1}});
 for(var pass=0;pass<2;pass++){
  document.querySelectorAll('body *').forEach(function(e){
   if(e.closest('.mscroll,svg')||e.tagName==='TABLE'||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;
   var r=e.getBoundingClientRect();if(r.width<=W()+1)return;
   var cs=getComputedStyle(e);
   if(cs.position==='fixed')return;
   if(cs.display.indexOf('grid')>=0)e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,150px),1fr))';
   else if(cs.display.indexOf('flex')>=0)e.style.flexWrap='wrap';
   if(e.tagName==='svg'||e.tagName==='SVG'){e.style.width='100%';e.style.height='auto'}
   else{e.style.maxWidth='100%';e.style.minWidth='0';e.style.boxSizing='border-box'}});
 }}
function floors(){
 var m=location.pathname.match(/\/floor\/(\d\d)\/([^\/]*)$/);
 if(!m||document.getElementById('flsel')||document.querySelector('.flpick'))return;
 var n=+m[1],page=m[2]||'',pad=function(k){return(k<10?'0':'')+k};
 var s=document.createElement('span');s.className='flpick';
 var o='';for(var k=1;k<=20;k++)o+='<option value="'+k+'"'+(k===n?' selected':'')+'>Floor '+k+'</option>';
 s.innerHTML='<button aria-label="Previous floor"'+(n<=1?' disabled':'')+'>&larr;</button><select aria-label="Choose a floor">'+o+'</select><button aria-label="Next floor"'+(n>=20?' disabled':'')+'>&rarr;</button>';
 var go=function(k){location.href='../'+pad(k)+'/'+page};
 var b=s.querySelectorAll('button');b[0].onclick=function(){go(n-1)};b[1].onclick=function(){go(n+1)};s.querySelector('select').onchange=function(){go(+this.value)};
 var nav=document.querySelector('nav');
 if(nav){nav.style.display=nav.style.display||'flex';nav.style.flexWrap='wrap';nav.style.alignItems='center';nav.appendChild(s)}
 else{var h=document.querySelector('h1');if(h)h.parentElement.insertBefore(s,h.nextSibling)}}
function run(){try{floors()}catch(e){}try{fit()}catch(e){}}
if(document.readyState!=='loading')run();else document.addEventListener('DOMContentLoaded',run);
window.addEventListener('load',run);var t=null;
new MutationObserver(function(){clearTimeout(t);t=setTimeout(function(){try{fit()}catch(e){}},300)}).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(run,300)});
})();</script></body></html>
