y","think":"no lapisia and the market is expensive; farming quadruples drops, and at 80 experience barely matters anymore","say":"out of lapisia, farming for a while"},{"id":"stop_high","think":"past +14 each try fails most of the time and breaks levels; without a big stock it is cheaper to stop and save","say":"not risking +15 without a full bag"},{"id":"rich_buy","think":"i have more gold than i can ever use; buying a ready enchanted piece beats years of failed tries","say":"rich enough to just buy the enchant lol"},{"id":"hoard_lapis","think":"my slots are full and i keep piling lapis; someone else needs it more and will pay","say":"selling spare lapis, i got way too much"},{"id":"lonely_town","think":"i keep hunting alone and it is wearing me down; town is where people meet","say":"going to town, need to see some ppl"},{"id":"grief_friends","think":"losing someone is easier with others around; i should not be alone right now","say":"gonna go find my friends"},{"id":"joy_share","think":"good news is better shared; telling friends makes them happy too","say":"guys guess what happened lol"},{"id":"envy_work","think":"my friends are stronger; envy is useless unless it makes me work, so farm and catch up","say":"everyone is ahead of me, time to farm"},{"id":"elder_teach","think":"i have seen enough to know what works; the young should not repeat my mistakes","say":"listen kid, dont enchant before 80"},{"id":"partner_time","think":"we barely talk anymore; love fades if nobody tends to it","say":"gonna spend some time with my partner"},{"id":"outgrown","think":"the monsters here give almost no experience for my level; staying is wasting hours","say":"this map is too easy now, moving on"}],"mentors":{"rows":[],"history":[{"year":897,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"found_alone":0,"knows_0":0.975,"independence_0":0.975,"solo_0":true,"knows_1":0.977,"independence_1":0.977,"solo_1":true},{"year":898,"talk":0.1,"hints":0,"explains":0,"found_hinted":0,"fou
