return Object.entries(t).map(([s,steps])=>{let it=null;for(const st of steps)if(st[0]<=G)it=st;return it?`<div><span>${s}</span><span>${esc(it[1])} <span class="sub">lv ${it[0]}</span></span></div>`:''}).join('')}
const CATN={atk:'attack',heal:'healing',buff:'buff',pas:'passive',util:'utility'};
function skillsOf(x){const L=(D.skills||{})[x.job];if(!L||!x.sk.length)return '<p class="sub">Skills begin from this version on.</p>';

return (rows.length?rows.map(([s,n])=>`<div class="bar"><span>${esc(s[0])} <span class="sub">${CATN[s[1]]}</span></span><span class="t"><i style="width:${n/15*100}%;background:#5fb3ff"></i></span><span class="n">${n}/15</span></div>`).join(''):'<p class="sub">No skills trained yet.</p>')
+`<p class="sub">${x.skp} unspent skill points. Which skill to train next is their own brain's choice.</p>`}
const EMO=['Joy','Sadness','Anger','Pride','Grief','Loneliness','Trust','Envy'],ECOL=['#f2c14e','#6f8cff','#ff6a5a','#c58bff','#9c9283','#4fc3c3','#7fd18b','#9bd16f'];
function feelOf(x){if(!x.emo.length)return '<p class="sub">Feelings begin from this version on.</p>';const v=x.emo.slice(0,8).concat([x.emo[9]]);const nm=EMO.concat(['Fear']);
return nm.map((n,i)=>`<div class="bar"><span>${n}</span><span class="t"><i style="width:${Math.max(1,v[i]*100)}%;background:${ECOL[i]||'#e07b39'}"></i></span><span class="n">${Math.round(v[i]*100)}</span></div>`).join('')+
'<p class="sub">Simulated feelings, 0 to 100. See the Book of Feelings in the <a href="tavern.html#book">Tavern</a>.</p>'}
function friendsOf(x){if(!x.emo.length)return '<p class="sub">Friendship begins from this version on.</p>';
const love=x.partner>=0?`<p>Love for their partner: <b>${Math.round(x.emo[8]*100)}</b> / 100</p>`:'<p class="sub">No partner.</p>';
return love+(x.fr.length?x.fr.map(f=>`<div class="bar"><span>${P[f[0]]?`<button class="lnk" data-go="${f[0]}">${esc(P[f[0]].name)}</button>`:(D.ghosts[f[0]]?esc(D.ghosts[f[0]][0]):'?')}</span><span class="t"><i style="width:${f[1]*100}%;background:#7fd18b"></i></span><span class="n">${Math.round(f[1]*100)}</span></div><div class="sub" style="margin:-2px 0 6px 0">friends since year ${f[2]}</div>`).join(''):'<p class="sub">No friends right now.</p>')}
function wordsOf(x){if(!x.voc&&!x.qt.length)return '<p class="sub">Language begins from this version on.</p>';
return `<div class="kv"><span>Words known</span><span>${fmt(x.voc)}</span>${x.lib.length?`<span>Replies learned</span><span>${fmt(x.lib[0])} conversation patterns</span><span>Wisdom</span><span>${x.lib[1]} lessons from the library</span>`:''}<span>Favorite slang</span><span>${x.sl.length?x.sl.map(esc).join(', '):'<span class="muted">none</span>'}</span></div>`+
(x.qt.length?'<p class="sub" style="margin-top:8px">Lately they said:</p>'+x.qt.slice().reverse().map(q=>`<p style="font-family:Consolas,monospace;margin:4px 0">"${esc(q[2])}" <span class="sub">year ${q[0]}</span></p>`).join(''):'')}
function craftOf(x){const c=x.cf;if(!c.length)return '<p class="sub">Farming, linking and enchanting begin from this version on.</p>';
return `<div class="kv"><span>Weapon</span><span><b>+${c[4]}</b></span><span>Armour</span><span><b>+${c[5]}</b></span>
<span>Lapis linked</span><span>${c[2]} of 12 slots (+${c[3]} stats)</span><span>In the bag</span><span>${fmt(c[0])} Lapis, ${fmt(c[1])} Lapisia</span>
<span>Crafting</span><span>${fmt(c[7])} successes in ${fmt(c[6])} tries${c[8]?`, ${fmt(c[8])} Lapisia bought from merchants`:''}</span>
${x.made.length&&(x.made[0]||x.made[1])?`<span>Made goods</span><span>sold ${fmt(x.made[0])}, bought ${fmt(x.made[1])} enchanted pieces</span>`:''}
${x.tr8.length?`<span>Market</span><span>sold ${fmt(x.tr8[0])} Lapis, ${fmt(x.tr8[1])} Lapisia (${fmt(x.tr8[4])} gold earned); bought ${fmt(x.tr8[2])} Lapis, ${fmt(x.tr8[3])} Lapisia</span>`:''}</div>
<p class="sub">New gear loses its links and enchants, so when to craft is part of what their brain learns.</p>`}
function build(st,job){const base=[10,10,10,10,10,10];const MAIN=[0,0,0,1,3,4];base[MAIN[job]]+=4;const sp=st.map((v,i)=>Math.max(0,v-base[i]));
const tot=sp.reduce((a,b)=>a+b,0);if(!tot)return 'No points spent yet';const o=sp.map((v,i)=>[v/tot,STATS[i]]).sort((a,b)=>b[0]-a[0]);
return o.filter(v=>v[0]>=0.15).map(v=>`${v[1]} ${Math.round(v[0]*100)}%`).join(' · ')}

<div class="kv" style="margin-top:10px"><span>Battles won</span><span>${fmt(x.kills)}</span><span>Defeats</span><span>${fmt(x.deaths)}</span>
<span>Gold</span><span>${fmt(x.gold)}</span><span>Hours adventuring</span><span>${fmt(x.hours)}</span><span>Health</span><span>${Math.round(x.hp*100)}%</span></div></div>
${x.rd&&x.rd.length?`<div class="box" style="grid-column:1/-1"><h3>Fighter profile</h3>${radarOf(x)}</div>`:''}
<div class="box"><h3>Stats</h3>${bars(STATS,x.st,Math.max(...x.st),col,'')}<div class="sub" style="margin-top:6px">Build: ${build(x.st,x.job)}</div></div>
${x.xt[1]?`<div class="box"><h3>New generation</h3><div>Trained past level 80: <b>+${fmt(x.xt[0])}</b> stat points (up to 30,000 per stat)</div><div>From what they wear: <b>+${fmt(x.xt[2])}</b> to their main stat, <b>+${fmt(x.xt[3])}</b> to recovery</div></div>`:''}
${x.mem.length?`<div class="box"><h3>Memories</h3>${x.mem.slice().reverse().map(m=>`<div>Year ${m.y}: ${esc({loss:'lost '+(m.who||'someone'),child:(m.who||'a child')+' was born',married:'married '+(m.who||''),max:'reached level 80',ench:'enchanted a weapon to +'+m.n,hero:'led the side to victory in the war',crown:'took the throne',arena:'beat '+(m.who||'someone')+' in the Tower Arena',arena_loss:'lost to '+(m.who||'someone')+' in the Tower Arena'}[m.kind]||m.kind)}</div>`).join('')}</div>`:''}
<div class="box gear"><h3>Equipment (item level ${Math.round(x.gear)})</h3>${gearOf(x)}<p class="sub">The simulation tracks one gear level; these are the best real ${FAC[x.fac]} ${JOBS[x.job]} items at that level.</p></div>

<div class="box"><h3>Where their next stat points go</h3>${bars(STATS,x.sp,100,'#f2c14e','%')}${x.lv>=80?'<p class="sub">At level 80 there are no more points to spend.</p>':''}</div>
${D.floor?`<div class="box"><h3>Journey through the Tower</h3>${jrOf(x)}</div>`:''}
<div class="box"><h3>Family</h3><div class="kv"><span>Partner</span><span>${who(x.partner)}</span><span>Parents</span><span>${who(x.p[0])}<br>${who(x.p[1])}</span>
<span>Children</span><span>${ch}</span><span>Born</span><span>${x.gen==0&&x.born<=0?'founding generation':'year '+x.born}</span></div></div></div>`;
for(const b of el.querySelectorAll('[data-go]'))b.onclick=()=>{show(+b.dataset.go);el.scrollIntoView({behavior:'smooth'})};

q.oninput=list;list();show(x.k)}else{
document.getElementById('sub').textContent=fmt(all.length)+' living citizens. Updates every game year; the page reloads every 60 seconds unless you are typing.';

<script>(function(){
var W=function(){return window.innerWidth};
function fit(){
 if(W()>760)return;
 document.querySelectorAll('table').forEach(function(t){
  if(t.dataset.mw||t.closest('.mscroll'))return;var p=t.parentElement;if(!p)return;

 document.querySelectorAll('body *').forEach(function(e){                       // grids squeezed into slivers: let them stack

   else if(mn<110){e.style.gridTemplateColumns='repeat(auto-fit,minmax(min(100%,140px),1fr))';e.dataset.mg=1}});
 for(var pass=0;pass<2;pass++){
  document.querySelectorAll('body *').forEach(function(e){
   if(e.closest('.mscroll,svg')||e.tagName==='TABLE'||e.tagName==='SCRIPT'||e.tagName==='STYLE')return;

   else{e.style.maxWidth='100%';e.style.minWidth='0';e.style.boxSizing='border-box'}});
 }}
